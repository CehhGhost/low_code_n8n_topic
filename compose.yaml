# Учебное окружение: только для локального запуска, не для публикации в интернет.
name: n8n-workflow-lab

services:
  mock-api:
    image: python:3.12-alpine
    command: ["python", "/app/server.py"]
    working_dir: /app
    volumes:
      - ./mock-api:/app:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.43.7}
    depends_on:
      mock-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"  # Только локальное учебное окружение без HTTPS
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
